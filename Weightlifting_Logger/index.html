<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weightlifting</title>
  </head>
  <body>
    <div>
      <label for="exercise_name">Exercise:</label>
      <input type="text" name="exercise_name" id="exercise_name" />
    </div>

    <div>
      <label for="sets">Sets:</label>
      <input type="number" name="sets" id="sets" />
    </div>

    <div>
      <label for="reps">Reps:</label>
      <input type="number" name="reps" id="reps" />
    </div>

    <div>
      <label for="weight">Weight(kg): </label>
      <input type="number" name="weight" id="weight" />
    </div>

    <button class="entry">Add Entry</button>
    <div class="display"></div>
  </body>
  <script src="script.js"></script>
</html>
